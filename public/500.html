<!DOCTYPE html>
<html lang="ko">

<head>
  <title>일시적인 오류 - 1분 사주</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/icon.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .error-container {
      max-width: 400px;
    }

    .error-emoji {
      font-size: 80px;
      margin-bottom: 20px;
      animation: shake 3s ease-in-out infinite;
    }

    @keyframes shake {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-5deg);
      }

      75% {
        transform: rotate(5deg);
      }
    }

    .error-code {
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(135deg, #E8775F, #F59E0B);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 14px;
      color: #a0a0b0;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .home-btn {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(135deg, #B47AE8, #E8775F);
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(180, 122, 232, 0.4);
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-emoji">🐱‍💻</div>
    <div class="error-code">500</div>
    <h1 class="error-title">앗, 서버에 문제가 생겼어요!</h1>
    <p class="error-desc">
      일시적인 오류가 발생했어요.<br>
      잠시 후 다시 시도하면 정상적으로 작동할 거예요! 🙏<br>
      계속 문제가 있다면 새로고침 해보세요~
    </p>
    <a href="/" class="home-btn">🏠 홈으로 돌아가기</a>
  </div>
</body>

</html>
